<!-- The README's opening image and the social preview (tools/preview/screenshots.mjs fills in
     the font, the icon and the overview screenshot). -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "GS"; src: url({{font}}) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
body { background: radial-gradient(120% 140% at 0% 0%, #1d2433 0%, #11141b 55%, #0d0f14 100%); font-family: "GS", sans-serif; color: #e8ecf3; position: relative; }
.text { position: absolute; left: 72px; top: 0; bottom: 0; width: 448px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.brand { display: flex; align-items: center; gap: 18px; }
.brand img { width: 84px; height: 84px; }
h1 { font-size: 64px; font-weight: 650; letter-spacing: -1.5px; margin: 0; }
p { margin: 0; font-size: 26px; line-height: 1.35; color: #aab3c2; font-weight: 420; }
p b { color: #e8ecf3; font-weight: 560; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.tags span { font-size: 17px; padding: 6px 13px; border-radius: 999px; background: rgba(120,160,255,.12); color: #9fc0ff; font-weight: 520; }
.shot { position: absolute; left: 540px; top: 74px; width: 900px; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
.shot img { display: block; width: 100%; }
</style></head><body>
<div class="text">
  <div class="brand"><img src="{{icon}}" alt=""><h1>Tributary</h1></div>
  <p><b>A fast, friendly git client</b> for macOS and Windows, with first&#8209;class Git LFS, locks and art diffs.</p>
  <div class="tags"><span>Undo everything</span><span>Pull requests</span><span>Git LFS</span></div>
</div>
<div class="shot"><img src="{{shot}}" alt=""></div>
</body></html>
