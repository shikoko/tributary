<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Tributary's app icon (dark): a branch in the graph's colours bends in to join the main
    line at a commit, as a merged branch does in the history. Drawn by tools/icons/draw.py;
    change that, not this file.
  -->
  <defs>
    <path id="tile" d="M924 512C924 922 922 924 512 924C102 924 100 922 100 512C100 102 102 100 512 100C922 100 924 102 924 512Z"/>
    <clipPath id="clip"><use href="#tile"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#1c2333"/><stop offset="1" stop-color="#0b0e14"/></linearGradient>
    <linearGradient id="branch" gradientUnits="userSpaceOnUse" x1="0" y1="924" x2="0" y2="330">
      <stop offset="0" stop-color="#ff4f9a"/><stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000"><circle cx="380" cy="330" r="40"/><circle cx="380" cy="760" r="30"/></g>
    </mask>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <use href="#tile" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <g mask="url(#holes)">
      <g fill="none" stroke-width="96">
        <path d="M700 1060V700C700 520 380 520 380 330" stroke="url(#branch)"/>
        <path d="M380 1060V-40" stroke="#ffffff"/>
      </g>
      <circle cx="380" cy="330" r="104" fill="#ffffff"/>
      <circle cx="380" cy="760" r="76" fill="#ffffff"/>
    </g>
  </g>
  <use href="#tile" fill="none" stroke="url(#rim)" stroke-width="5" clip-path="url(#clip)"/>
</svg>
