[package]
name = "tributary"
version = "0.1.0"
description = "A fast, cross-platform git history graph viewer"
authors = ["shikoko"]
license = "MIT"
repository = "https://github.com/shikoko/tributary"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tributary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# System notifications, for new commits found by a background fetch.
tauri-plugin-notification = "2"
# Installs new versions from the project's GitHub releases.
tauri-plugin-updater = "2"
# Asks GitHub which release is the latest (the same HTTP client the updater uses).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust git implementation: reads history without needing git installed.
gix = { version = "0.90", default-features = false, features = ["sha1", "blob-diff", "status", "max-performance"] }
thiserror = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# App code reports errors instead of panicking; tests may unwrap.
unwrap_used = "warn"
expect_used = "warn"
