[package]
name = "tributary"
version = "0.1.0"
description = "A fast, cross-platform git history graph viewer"
authors = ["shikoko"]
license = "MIT"
repository = "https://github.com/shikoko/tributary"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tributary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# System notifications, for new commits found by a background fetch.
tauri-plugin-notification = "2"
# Installs new versions from the project's GitHub releases.
tauri-plugin-updater = "2"
# Asks GitHub which release is the latest (the same HTTP client the updater uses).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Textures the window can't show by itself, made into PNG previews (textures.rs).
image = { version = "0.25", default-features = false, features = ["png", "tga", "dds", "exr", "tiff", "hdr"] }
# Gravatar finds pictures by a SHA-256 hash of the email address.
sha2 = "0.10"
# Pure-Rust git implementation: reads history without needing git installed.
gix = { version = "0.90", default-features = false, features = ["sha1", "blob-diff", "status", "max-performance"] }
thiserror = "2"
# Notices changes to a repository's files made outside the app, to show them at once.
notify = "8"
# Leaves out what .gitignore ignores (build output) when watching: ripgrep's matcher.
ignore = "0.4"
# Blender files are often compressed (gzip before Blender 3.0, zstd since): their
# preview pictures are read from the start of them (textures/blend.rs).
flate2 = "1"
ruzstd = "0.9"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The Dock icon on macOS, which follows the app's theme (app_icon.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

# The taskbar icon on Windows, which follows the app's theme too (app_icon.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
# The only exceptions, allowed where they are: setting the app's icon on macOS and Windows (app_icon.rs).
unsafe_code = "deny"

[lints.clippy]
# App code reports errors instead of panicking; tests may unwrap.
unwrap_used = "warn"
expect_used = "warn"
