name: Tidy footers

# Pull requests, issues and comments written from a Claude Code cloud session get a
# "Generated by Claude Code" footer added to the end, and it comes back after every edit
# made from there. The maintainer doesn't want attribution lines, so this takes it off
# again. It only runs for the owner's own writing that has the footer, and changes nothing
# else in it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  footer:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner && contains(github.event.pull_request.body, 'Claude Code')) ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, 'Claude Code')) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, 'Claude Code'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Remove the footer
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          case "$EVENT" in
            pull_request) url="repos/$GITHUB_REPOSITORY/pulls/$NUMBER" ;;
            issues) url="repos/$GITHUB_REPOSITORY/issues/$NUMBER" ;;
            issue_comment) url="repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT" ;;
            pull_request_review_comment) url="repos/$GITHUB_REPOSITORY/pulls/comments/$COMMENT" ;;
          esac
          gh api "$url" --jq .body > body.md
          node .github/scripts/tidy-footers.mjs body.md tidy.md
          if [ -f tidy.md ]; then
            gh api -X PATCH "$url" -F body=@tidy.md --silent
            echo "Removed the footer."
          fi
