name: Tidy pull requests

# Pull requests opened from a Claude Code cloud session get a "Generated by Claude Code"
# footer added to their description, and it comes back after every edit made from there.
# The maintainer doesn't want attribution lines, so this takes it off again. It only runs
# for the owner's own pull requests whose description has the footer, and changes nothing
# else in it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  footer:
    if: github.event.pull_request.user.login == github.repository_owner && contains(github.event.pull_request.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    steps:
      - name: Remove the footer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body > body.md
          node -e '
            const fs = require("fs");
            const body = fs.readFileSync("body.md", "utf8");
            const tidy = body.replace(/\n*(?:-{3,}[ \t]*\n+)?_Generated by \[Claude Code\]\([^)]*\)_\s*$/, "").replace(/\s+$/, "") + "\n";
            if (tidy !== body) fs.writeFileSync("tidy.md", tidy);
          '
          if [ -f tidy.md ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -F body=@tidy.md --silent
            echo "Removed the footer."
          fi
