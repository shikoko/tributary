name: Build

# Builds only run when started by hand: Actions tab → Build → Run workflow.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Version tag for a draft GitHub release, like v0.2.0. Leave empty to only build the installers."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Releases get the signing key from the "release" environment, which only main can use
    # and which waits for approval. Other builds use "test-build", which has no secrets, so
    # they're unsigned (they install by hand, but not as updates).
    environment: ${{ inputs.release != '' && 'release' || 'test-build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # One app that runs natively on both Apple Silicon and Intel Macs.
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The licences of everything the app is made with, installed beside it.
      - name: Third-party notices
        run: node tools/notices.mjs

      # A release's version comes from its tag (v0.2.0 → 0.2.0). With the signing key
      # secret set, the installers are signed for automatic updates too.
      - name: Build installers
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          BRANCH: ${{ github.ref }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config=$(node -e '
            const config = {};
            const version = (process.env.RELEASE || "").replace(/^v/, "");
            if (version) {
              if (process.env.BRANCH !== "refs/heads/main") {
                console.error("Releases are built from main: choose main in \"Use workflow from\".");
                process.exit(1);
              }
              if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version)) {
                console.error(`"${process.env.RELEASE}" is not a version like v0.2.0`);
                process.exit(1);
              }
              config.version = version;
            }
            if (process.env.TAURI_SIGNING_PRIVATE_KEY) config.bundle = { createUpdaterArtifacts: true };
            console.log(JSON.stringify(config));
          ')
          npm run tauri build -- --target ${{ matrix.target }} --config "$config"

      - uses: actions/upload-artifact@v7
        with:
          name: tributary-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # When a version tag is given, create a draft GitHub release with the installers attached.
  release:
    if: inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The build jobs' files come in their bundle folders (dmg/, macos/, msi/, nsis/):
      # gather them in one folder, as the release's files.
      - name: Gather the installers
        run: |
          mkdir installers
          find artifacts -type f -exec mv -t installers {} +
          ls -l installers

      # A draft left by an earlier try at this version is replaced (drafts aren't public and
      # have no tag yet). A version that's already been published is left alone.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\") | {id, draft}]")
          if [ "$(jq '[.[] | select(.draft | not)] | length' <<<"$existing")" != 0 ]; then
            echo "::error::$TAG has already been released: use a new version tag."
            exit 1
          fi
          for id in $(jq -r '.[].id' <<<"$existing"); do
            echo "Replacing the earlier draft of $TAG"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # The notes written for this version, or else GitHub's list of what was merged.
          notes=(--generate-notes)
          if [ -f "docs/release-notes/$TAG.md" ]; then notes=(--notes-file "docs/release-notes/$TAG.md"); fi
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            "${notes[@]}" \
            --title "Tributary $TAG"

      # latest.json tells Tributary about the new version once the draft is published.
      - name: Add the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          # The draft's notes and the names GitHub gave its files.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0] | {body, assets: [.assets[] | {name}]}" \
            > release.json
          node .github/scripts/latest-json.mjs "$GITHUB_REPOSITORY" "$TAG" release.json installers latest.json "docs/release-notes/$TAG.md"
          if [ -f latest.json ]; then
            gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY"
          fi
