name: Build

# Builds only run when started by hand: Actions tab → Build → Run workflow.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Version tag for a draft GitHub release, like v0.2.0. Leave empty to only build the installers."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # One app that runs natively on both Apple Silicon and Intel Macs.
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: tributary-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # When a version tag is given, create a draft GitHub release with the installers attached.
  release:
    if: inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: >
          gh release create "$TAG" installers/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --draft
          --generate-notes
          --title "Tributary $TAG"
