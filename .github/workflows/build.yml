name: Build

# The installers for macOS and Windows, signed for automatic updates:
# - on every merge into develop, as a beta of the next version, like 0.3.0-beta.4: published
#   as a GitHub pre-release, and offered to the copies of Tributary that get betas (through
#   the beta channel, .github/scripts/beta-channel.sh). A merge of only documentation isn't
#   built;
# - on every merge into main, as a release: published as the latest GitHub release, which
#   offers it to everyone;
# - for any branch, by hand (Actions → Build → Run workflow), to try it before it's merged
#   (the run's Artifacts, unsigned).
# The next version comes from the labels of the pull requests merged since the last
# release (.github/scripts/next-version.mjs).
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer build of a branch replaces one still going, but a release always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and its tags: the last release, and what's been merged since.
          fetch-depth: 0

      # A merge into develop of only words and pictures (Markdown, docs/, the issue forms,
      # the licence) would be a beta just like the one before: it isn't built.
      - name: Anything to build?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          DEVELOP: ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
        run: |
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || true)
          if [ "$DEVELOP" = true ] && [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/)' <<<"$changed"; then
            echo "::notice::Only documentation changed: no beta."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$RELEASE" = true ]; then
            version=$(node .github/scripts/next-version.mjs)
          else
            version=$(node .github/scripts/next-version.mjs --beta)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    # Releases (builds of main) and betas (builds of develop) get the signing key from the
    # "release" environment, which only main and develop can use. Other builds use
    # "test-build", which has no secrets, so they're unsigned (they install by hand, but not
    # as updates).
    environment: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && 'release' || 'test-build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # One app that runs natively on both Apple Silicon and Intel Macs.
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The licences of everything the app is made with, installed beside it.
      - name: Third-party notices
        run: node tools/notices.mjs

      # The terms of use, on the installer's licence page (as rich text), which shows when
      # the setup below can't show its own window. The setup shows them itself.
      - name: Terms of use
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          mkdir -p src-tauri/target
          node tools/terms-rtf.mjs src-tauri/target/TERMS.rtf
          echo "TERMS_RTF=$GITHUB_WORKSPACE/src-tauri/target/TERMS.rtf" >> "$GITHUB_ENV"

      # Tributary's uninstall window: the setup, without installers in it, installed with the
      # app (as a resource), which the uninstall entry points to (src-tauri/windows/hooks.nsh).
      - name: Uninstall window
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          npm run setup:build
          cargo build --release --manifest-path src-tauri/Cargo.toml -p tributary-setup --features custom-protocol --target ${{ matrix.target }}
          mkdir -p src-tauri/target/uninstall
          cp "src-tauri/target/${{ matrix.target }}/release/tributary-setup.exe" src-tauri/target/uninstall/tributary-uninstall.exe
          echo "UNINSTALLER=target/uninstall/tributary-uninstall.exe" >> "$GITHUB_ENV"

      # With the signing key secret set, the installers are signed for automatic updates too.
      - name: Build installers
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # On a build server (CI=true) Tauri leaves out the disk image's window: the
          # background and where Tributary and Applications sit, which Finder sets up. Keep it.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config=$(node -e '
            const config = { version: process.env.VERSION, bundle: {} };
            if (process.env.TAURI_SIGNING_PRIVATE_KEY) config.bundle.createUpdaterArtifacts = true;
            if (process.env.TERMS_RTF) config.bundle.licenseFile = process.env.TERMS_RTF;
            if (process.env.UNINSTALLER) config.bundle.resources = { [process.env.UNINSTALLER]: "tributary-uninstall.exe" };
            console.log(JSON.stringify(config));
          ')
          echo "$config" > "$RUNNER_TEMP/tauri-config.json"
          npm run tauri build -- --target ${{ matrix.target }} --config "$config"

      # The disk image opens on a window showing Tributary and Applications over the
      # background, telling people to drag one onto the other: Finder keeps that window's
      # settings in a .DS_Store, which isn't there when that part was skipped.
      - name: Check the disk image's window
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          volume=$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/.*$')
          ls -la "$volume" "$volume/.background" || true
          if [ -f "$volume/.DS_Store" ] && [ -d "$volume/.background" ]; then ok=1; else ok=0; fi
          hdiutil detach "$volume" -quiet || hdiutil detach "$volume" -force -quiet
          if [ "$ok" = 0 ]; then
            echo "::error::The disk image has no window settings: it would open as a plain Finder window."
            exit 1
          fi

      # On Windows, what people download is Tributary's own setup: a window in the app's
      # style that carries two installers for the app (just for you, and for everyone on the
      # PC) and runs one silently. It's also what the automatic updates download, so it's
      # signed like the installers, and it's the only Windows file in the release.
      - name: Build the setup
        if: matrix.name == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle/nsis
          work=src-tauri/target/setup-installers
          mkdir -p "$work"
          installer=$(ls "$bundle"/*-setup.exe)
          name=$(basename "$installer")
          version=$(sed -E 's/^Tributary_([^_]+)_.*$/\1/' <<<"$name")
          mv "$installer" "$work/just-me.exe"
          rm -f "$bundle"/*.sig
          # The same app, as an installer for everyone on the PC (in Program Files).
          npm run tauri bundle -- --target ${{ matrix.target }} --bundles nsis --config "$RUNNER_TEMP/tauri-config.json" \
            --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"nsis":{"installMode":"perMachine"}}}}'
          mv "$(ls "$bundle"/*-setup.exe)" "$work/everyone.exe"
          npm run setup:build
          TRIBUTARY_INSTALLER="$(cygpath -w "$PWD/$work/just-me.exe")" \
          TRIBUTARY_INSTALLER_ALL="$(cygpath -w "$PWD/$work/everyone.exe")" \
          TRIBUTARY_VERSION="$version" TAURI_CONFIG="{\"version\":\"$version\"}" \
            cargo build --release --manifest-path src-tauri/Cargo.toml -p tributary-setup --features custom-protocol --target ${{ matrix.target }}
          cp "src-tauri/target/${{ matrix.target }}/release/tributary-setup.exe" "$bundle/$name"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri signer sign -- --app-version "$version" "$bundle/$name"
          fi
          ls -l "$bundle"

      - uses: actions/upload-artifact@v7
        with:
          name: tributary-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  # Builds of develop: a beta. It's published as a pre-release (which GitHub's "latest"
  # skips, so only the copies that get betas are offered it), with what was merged since
  # the beta before, and the beta channel points at it. The newest few betas are kept.
  beta:
    if: github.ref == 'refs/heads/develop'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Gather the installers
        run: |
          mkdir installers
          find artifacts -type f -exec mv -t installers {} +
          ls -l installers

      - name: Publish the beta
        run: |
          if ! ls installers/*.sig >/dev/null 2>&1; then
            echo "::error::The installers aren't signed for updates (is develop allowed to use the release environment?), so they can't be a beta."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is out already: this build was run again."
            echo "AGAIN=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # What's in it: what was merged since the beta before (or the last release).
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select((.draft | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-beta\\.[0-9]+)?$")))] | sort_by(.created_at) | last | .tag_name // empty')
          since=()
          if [ -n "$previous" ]; then since=(--notes-start-tag "$previous"); fi
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Tributary $TAG" \
            --notes "A beta of what's coming, built from develop. Tributary offers it to people who get beta versions (About Tributary → Get beta versions). It may have rough edges: [tell us](https://github.com/$GITHUB_REPOSITORY/issues/new/choose) if something's wrong." \
            --generate-notes "${since[@]}"

      - name: Point the beta channel at it
        if: env.AGAIN != 'true'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{body, assets: [.assets[] | {name}]}' > release.json
          node .github/scripts/latest-json.mjs "$GITHUB_REPOSITORY" "$TAG" release.json installers latest.json
          .github/scripts/beta-channel.sh latest.json

      - name: Keep the newest betas
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.prerelease and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$")))] | sort_by(.created_at) | reverse | .[5:] | .[].tag_name' |
            while read -r old; do
              echo "Removing $old"
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done

  # Builds of main: the GitHub release of the version in the files, with the installers
  # attached. It's made as a draft, given its latest.json, then published: publishing it is
  # what offers the update to everyone, so they never see it without its latest.json. The
  # beta channel points at it too.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The build jobs' files come in their bundle folders (dmg/, macos/, msi/, nsis/):
      # gather them in one folder, as the release's files.
      - name: Gather the installers
        run: |
          mkdir installers
          find artifacts -type f -exec mv -t installers {} +
          ls -l installers

      # A draft left by an earlier try at this version is replaced (drafts aren't public and
      # have no tag yet). A version that's already been published is left alone.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\") | {id, draft}]")
          if [ "$(jq '[.[] | select(.draft | not)] | length' <<<"$existing")" != 0 ]; then
            echo "::error::$TAG has already been released."
            exit 1
          fi
          for id in $(jq -r '.[].id' <<<"$existing"); do
            echo "Replacing the earlier draft of $TAG"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # The notes written for this version, or else GitHub's list of what was merged.
          notes=(--generate-notes)
          if [ -f "docs/release-notes/$TAG.md" ]; then notes=(--notes-file "docs/release-notes/$TAG.md"); fi
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            "${notes[@]}" \
            --title "Tributary $TAG"

      # latest.json tells Tributary about the new version once the draft is published.
      - name: Add the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          # The draft's notes and the names GitHub gave its files.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0] | {body, assets: [.assets[] | {name}]}" \
            > release.json
          node .github/scripts/latest-json.mjs "$GITHUB_REPOSITORY" "$TAG" release.json installers latest.json "docs/release-notes/$TAG.md"
          if [ -f latest.json ]; then
            gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY"
          fi
          else
            echo "::error::No latest.json (the installers aren't signed for updates): $TAG is left as a draft."
            exit 1
          fi

      # Published with its latest.json in place: from now on, everyone is offered it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "::notice::$TAG is released."

      # A release is newer than its betas: the copies that get betas are offered it too.
      - name: Point the beta channel at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/beta-channel.sh latest.json
