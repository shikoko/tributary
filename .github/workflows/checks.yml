name: Checks

# Every pull request into develop or main is checked, and can only be merged once the
# checks pass (a ruleset makes them required). Pull requests from forks run without any
# secrets, and nothing here needs one.
#
# Each merge into develop is checked again too, as merged: a pull request is merged
# straight after it's rebased onto develop, without waiting for its checks to run again, so
# this is what catches two pull requests that each passed but don't work together. Each
# merge has its own run, never cancelled by the next: a merge of only documentation right
# after one of code would otherwise cancel the code's run and then skip everything itself.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# A pull request's newer push cancels the run of the one before; a merge's run is its own.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Linux jobs name their Ubuntu (not ubuntu-latest), so a new one is a change made on
# purpose, with its own run of the checks, rather than one that happens by itself.
jobs:
  # What changed decides what runs. Only words and pictures (Markdown, docs/, the issue
  # forms, the licence): nothing is built or tested. Nothing on the Rust side (src-tauri/,
  # package.json, this workflow and its scripts): the Rust jobs on Linux, macOS and Windows
  # are skipped, which are most of the wait; the smoke test still builds the Rust side on
  # Linux.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    # Every job stops after about twice its longest run, so one that hangs frees its runner
    # and the queue behind it, instead of holding them for GitHub's six hours.
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
      rust: ${{ steps.files.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A workflow's scripts are only read when their step runs, some only on a release or a
      # beta: a mistake in one is found here instead.
      - name: Workflow scripts
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 .github/scripts/check-workflows.py

      - name: Which parts?
        id: files
        env:
          # A pull request's changes, or a merge's (everything runs if they can't be told).
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || true)
          echo "$changed"
          code=true
          rust=true
          if [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/)' <<<"$changed"; then
            echo "::notice::Only documentation changed: the app isn't built or tested."
            code=false
            rust=false
          elif [ -n "$changed" ] && ! grep -qE '^(src-tauri/|src/api/generated\.ts$|package\.json$|\.github/workflows/checks\.yml$|\.github/scripts/)' <<<"$changed"; then
            echo "::notice::Nothing on the Rust side changed: its checks on Linux, macOS and Windows are skipped (the smoke test still builds it)."
            rust=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  # The app's TypeScript: types, lint and unit tests.
  app:
    name: App
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Types
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  # The Rust side on each system people run Tributary on: git, paths and line endings
  # behave differently on each.
  rust:
    name: Rust (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    # Windows took 10 minutes at most; more without its cache.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux libraries
        if: runner.os == 'Linux'
        timeout-minutes: 20
        # With retries, and another mirror if Ubuntu's on Azure can't be reached.
        run: .github/scripts/linux-libraries.sh

      # The app and the setup are built with their pages in them.
      - name: Pages
        run: |
          npm ci
          npx vite build
          npm run setup:build

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked

  # The preview (the app's pages over a stand-in for the desktop side) with demo
  # repositories, clicked through in Chromium.
  smoke:
    name: Smoke test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux libraries
        timeout-minutes: 20
        # With retries, and another mirror if Ubuntu's on Azure can't be reached.
        run: .github/scripts/linux-libraries.sh

      - name: Playwright
        timeout-minutes: 15
        run: |
          npm ci
          npm install --no-save playwright@1.63.0 axe-core@4.14.0
          # Its system libraries come from Ubuntu's mirror too: try again if it can't be reached.
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Couldn't install Chromium (try $attempt of 3): trying again."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build the preview
        run: npm run preview:build

      - name: Smoke test
        run: npm run preview:smoke

      - name: Catalogue screenshots
        run: npm run preview:catalogue -- --out catalogue-changes

      # The screenshots it compared with, the new ones and the pixels that changed.
      - name: Keep what changed in the catalogue
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-changes
          path: catalogue-changes
          if-no-files-found: ignore

  # The same smoke test in WebKit, Safari's engine, which draws the Mac app's window: what it
  # does differently from Chromium (styles, fonts, JavaScript) shows up here first.
  webkit:
    name: Smoke test (WebKit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Playwright
        timeout-minutes: 15
        run: |
          npm ci
          npm install --no-save playwright@1.63.0 axe-core@4.14.0
          for attempt in 1 2 3; do
            npx playwright install webkit && exit 0
            echo "::warning::Couldn't install WebKit (try $attempt of 3): trying again."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build the preview
        run: npm run preview:build

      - name: Smoke test
        run: npm run preview:smoke -- --browser webkit

  # The desktop app itself on Windows, not the preview: its Rust side, its permissions and
  # its window (WebView2), driven through tauri-driver and WebDriver (tools/e2e).
  desktop:
    name: Desktop tests (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Kept with the cache's other programs, so it's built once.
      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - name: Edge WebDriver
        run: .github/scripts/edge-driver.sh

      - run: npm ci

      - name: Desktop tests
        run: npm run e2e

      - name: Why the app didn't start (temporary)
        if: failure()
        run: .github/scripts/e2e-debug.sh

      # A screenshot of the window for each step that failed.
      - name: Keep the screenshots of what failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-failures
          path: tools/e2e/output
          if-no-files-found: ignore
