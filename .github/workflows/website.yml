name: Website

# The website in site/, on GitHub Pages, with the README's badges (.github/scripts/badges.mjs).
# Published:
# - on every merge into develop: the site, and how long ago develop last changed;
# - every day: the downloads and stars;
# - after a release is built (on main): the latest release;
# - or from the Actions tab (Run workflow).
# The site is plain files, so nothing is built. Pages needs switching on once, in the
# repository's Settings, Pages, Source: GitHub Actions; until then this says so and publishes
# nothing.
on:
  push:
    branches: [develop]
  schedule:
    - cron: "41 4 * * *"
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and a newer one waits instead of stopping one halfway.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  # The site, with its badges drawn afresh, packed for Pages. Publishing it is a job of its
  # own, so a publish that fails can be run again alone (Re-run failed jobs), with what was
  # packed here: packing it again in the same run gives Pages two copies, and it takes neither.
  pack:
    name: Pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pages-on: ${{ steps.pages.outputs.on }}
    steps:
      - name: Is Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages isn't switched on for this repository (Settings, Pages, Source: GitHub Actions), so the website wasn't published."
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.pages.outputs.on == 'true'

      # The badges are drawn with shields.io's library (badge-maker), from package.json.
      - uses: actions/setup-node@v7
        if: steps.pages.outputs.on == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.pages.outputs.on == 'true'
        run: npm ci --ignore-scripts

      # If GitHub's API doesn't answer, nothing is published: the site and the badges stay as
      # they were.
      - name: Badges
        if: steps.pages.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/badges.mjs site/badges

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.on == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.on == 'true'
        with:
          path: site

  publish:
    name: Publish
    needs: pack
    if: needs.pack.outputs.pages-on == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
